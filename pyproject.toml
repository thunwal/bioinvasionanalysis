# Makes the analysis code installable, e.g. for personal scripts in another folder:
#   pip install -e /path/to/bioinvasionanalysis
[project]
name = "bioinvasion"
version = "2.0.0.dev0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["bioinvasion", "bioinvasion.core", "bioinvasion.sources", "bioinvasion.report"]
